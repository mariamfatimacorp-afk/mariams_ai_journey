<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads Dashboard</title>
<style>
  :root { --brand:#4f46e5; --bg:#f6f7fb; --text:#1e213a; --muted:#6b7194; --card:#fff; --border:#e4e6f0; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:40px 20px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
  h1 { font-size:1.5rem; }
  .btn { background:var(--brand); color:#fff; text-decoration:none; padding:10px 16px; border-radius:10px; font-weight:600; font-size:.9rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .stat .n { font-size:1.7rem; font-weight:700; }
  .stat .l { color:var(--muted); font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; min-width:900px; }
  th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .tier { padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .tier.hot { background:#fee2e2; color:#b91c1c; }
  .tier.warm { background:#fef3c7; color:#b45309; }
  .tier.cold { background:#e0e7ff; color:#3730a3; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .need { max-width:280px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 Captured Leads</h1>
    <a class="btn" id="csv" href="/api/leads.csv">Export CSV</a>
  </header>
  <div class="stats" id="stats"></div>
  <div class="card">
    <table>
      <thead><tr>
        <th>When</th><th>Name</th><th>Contact</th><th>Company</th>
        <th>Score</th><th>Budget</th><th>Timeline</th><th>DM?</th><th class="need">Need</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const key = new URLSearchParams(location.search).get("key");
  const qs = key ? "?key=" + encodeURIComponent(key) : "";
  if (key) document.getElementById("csv").href = "/api/leads.csv" + qs;

  const fmtBudget = { under_1k:"< $1k", "1k_5k":"$1k–5k", "5k_25k":"$5k–25k", over_25k:"$25k+", unknown:"—" };
  const fmtTime = { asap:"ASAP", "1_3_months":"1–3 mo", "3_6_months":"3–6 mo", just_researching:"Researching", unknown:"—" };

  async function load() {
    const res = await fetch("/api/leads" + qs);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      document.getElementById("rows").innerHTML =
        `<tr><td colspan="9" class="empty">${err.error || "Failed to load leads"}</td></tr>`;
      return;
    }
    const { leads } = await res.json();
    const hot = leads.filter(l => l.tier === "hot").length;
    const warm = leads.filter(l => l.tier === "warm").length;
    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="n">${leads.length}</div><div class="l">Total leads</div></div>
      <div class="stat"><div class="n">${hot}</div><div class="l">🔥 Hot</div></div>
      <div class="stat"><div class="n">${warm}</div><div class="l">🌤 Warm</div></div>
      <div class="stat"><div class="n">${leads.length - hot - warm}</div><div class="l">❄️ Cold</div></div>`;

    const rows = document.getElementById("rows");
    if (!leads.length) {
      rows.innerHTML = `<tr><td colspan="9" class="empty">No leads yet — try the <a href="/">chat demo</a>.</td></tr>`;
      return;
    }
    rows.innerHTML = leads.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleString()}</td>
        <td><strong>${esc(l.name)}</strong></td>
        <td>${esc(l.email)}${l.phone ? "<br>" + esc(l.phone) : ""}</td>
        <td>${esc(l.company || "—")}</td>
        <td><span class="tier ${l.tier}">${l.score} · ${l.tier}</span></td>
        <td>${fmtBudget[l.budget_range] || "—"}</td>
        <td>${fmtTime[l.timeline] || "—"}</td>
        <td>${l.is_decision_maker ? "✅" : "—"}</td>
        <td class="need">${esc(l.need_summary || "")}${l.notes ? "<br><em>" + esc(l.notes) + "</em>" : ""}</td>
      </tr>`).join("");
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  load();
  setInterval(load, 15000);
</script>
</body>
</html>
