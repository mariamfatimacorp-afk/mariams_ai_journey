<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Qualification Agent — Demo</title>
<style>
  :root {
    --brand: #4f46e5; --brand-dark: #3730a3; --bg: #f6f7fb;
    --text: #1e213a; --muted: #6b7194; --card: #ffffff; --border: #e4e6f0;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  p.sub { color: var(--muted); margin-bottom: 24px; }
  .chat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; height: 560px; box-shadow: 0 8px 30px rgba(30,33,58,.08); overflow: hidden; }
  .chat-head { padding: 14px 18px; background: var(--brand); color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: .95rem; white-space: pre-wrap; }
  .msg.bot { background: #eef0fb; border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
  .msg.typing { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
  input { flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: .95rem; outline: none; }
  input:focus { border-color: var(--brand); }
  button { background: var(--brand); color: #fff; border: 0; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: .5; cursor: default; }
  .links { margin-top: 18px; font-size: .9rem; color: var(--muted); }
  .links a { color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lead Qualification Agent</h1>
  <p class="sub">Demo storefront — chat as if you were a visitor on your client's website.</p>

  <div class="chat">
    <div class="chat-head"><span class="dot"></span> Chat with us</div>
    <div class="msgs" id="msgs"></div>
    <form id="form">
      <input id="input" placeholder="Type a message…" autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <p class="links">
    View captured leads on the <a href="/dashboard">dashboard</a> ·
    Embed on any site with <code>&lt;script src="/widget.js"&gt;&lt;/script&gt;</code>
  </p>
</div>

<script>
  const msgs = document.getElementById("msgs");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let sessionId = null;

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
    return el;
  }

  async function init() {
    const res = await fetch("/api/session", { method: "POST" });
    const data = await res.json();
    sessionId = data.sessionId;
    add(data.message, "bot");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !sessionId) return;
    add(text, "user");
    input.value = "";
    send.disabled = true;
    const typing = add("typing…", "bot typing");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      typing.remove();
      add(data.reply || data.error || "Something went wrong.", "bot");
    } catch {
      typing.remove();
      add("Connection error — please try again.", "bot");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  init();
</script>
</body>
</html>
